<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glofy — Informe de Performance Review</title>
<link rel="icon" href="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{ --dark:#1c1c1c; --dark2:#2a2a2a; --dark3:#242424; --lime:#ceff00; --gray:#e1e1e1; --off:#ededed;
    --line:rgba(225,225,225,0.12); --muted:rgba(237,237,237,0.55); --sidebar-w:270px; }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--dark);color:var(--off);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--lime);color:var(--dark);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

  /* ---------- LAYOUT ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;
    padding:32px 26px;border-right:1px solid var(--line);display:flex;flex-direction:column;
  }
  .sidebar img.logo{height:22px;display:block;margin-bottom:26px;}
  .sidebar h1{font-size:20px;font-weight:800;line-height:1.25;margin:0 0 30px;}
  .side-nav{display:flex;flex-direction:column;gap:15px;margin-bottom:auto;}
  .side-nav a{font-size:13.5px;color:var(--muted);font-weight:500;transition:.15s;}
  .side-nav a:hover{color:var(--gray);}
  .side-nav a.active{color:#fff;font-weight:700;}
  .side-nav a.hidden-link{display:none;}
  .sidebar-actions{display:flex;flex-direction:column;gap:8px;margin-top:26px;}
  .main{flex:1;min-width:0;padding:40px 44px 90px;max-width:1180px;}

  .btn{border:1px solid var(--line);background:var(--dark2);color:var(--off);border-radius:999px;padding:10px 16px;
    font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s ease;}
  .btn:hover{border-color:var(--lime);}
  .btn.primary{background:var(--lime);color:var(--dark);border-color:var(--lime);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;}
  .btn:disabled{opacity:.5;cursor:progress;}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;align-self:flex-start;}
  .lang-toggle button{background:transparent;border:none;color:var(--muted);padding:8px 12px;font-size:11px;font-weight:700;}
  .lang-toggle button.active{background:var(--lime);color:var(--dark);}
  select#clientSelect{width:100%;appearance:none;background:var(--dark2);color:var(--off);border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;font-size:12px;font-weight:600;margin-top:6px;}
  .sidebar label.mini{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;}

  .page-title{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin:0 0 10px;text-transform:uppercase;}
  .page-sub{font-size:14px;color:var(--gray);opacity:.85;line-height:1.6;max-width:680px;margin:0 0 30px;}

  /* ---------- CARD ---------- */
  .card{position:relative;background:var(--dark3);border:1px solid var(--line);border-radius:22px;padding:26px 26px 24px;margin-bottom:18px;}
  .card .kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:14px;}
  .card .dots{position:absolute;top:22px;right:22px;color:var(--muted);font-size:16px;letter-spacing:1px;opacity:.6;}

  /* ---------- DATOS GENERALES ---------- */
  .cover-card{display:flex;gap:24px;align-items:stretch;}
  .cover-photo{width:220px;flex:none;border-radius:16px;overflow:hidden;background:var(--dark2);position:relative;}
  .cover-photo img{width:100%;height:100%;object-fit:cover;display:block;min-height:220px;}
  .cover-photo .ph-fallback{width:100%;height:100%;min-height:220px;display:flex;align-items:center;justify-content:center;
    font-size:42px;font-weight:800;color:var(--lime);}
  .cover-right{flex:1;}
  .cover-name{font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0 0 18px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-box{background:var(--dark2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .field-box .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:5px;}
  .field-box .val{font-size:15px;font-weight:700;color:var(--off);}
  .field-box .val small{display:block;font-size:11px;font-weight:500;color:var(--muted);}
  @media(max-width:760px){.cover-card{flex-direction:column;}.cover-photo{width:100%;}}

  /* ---------- MASONRY GRID ---------- */
  .masonry{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-bottom:0;}
  .masonry .card{margin-bottom:0;}
  @media(max-width:820px){.masonry{grid-template-columns:1fr;}}

  .pill-list{display:flex;flex-direction:column;gap:10px;}
  .pill-item{background:var(--dark2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--gray);}

  .narrative h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:16px 0 6px;}
  .narrative h4:first-child{margin-top:0;}
  .narrative p{font-size:13.5px;line-height:1.65;color:var(--gray);margin:0 0 10px;}

  .perf-body p{font-size:13.5px;line-height:1.7;color:var(--gray);margin:0 0 18px;}
  .metric-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .metric-row .m-lbl{width:150px;flex:none;font-size:12.5px;color:var(--gray);}
  .metric-track{flex:1;height:5px;background:var(--dark2);border-radius:3px;overflow:hidden;}
  .metric-track i{display:block;height:100%;width:0;background:var(--lime);border-radius:3px;transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .metric-row .m-val{width:60px;text-align:right;flex:none;font-size:13px;font-weight:800;color:var(--lime);}

  /* ---------- CROSS-SELL ---------- */
  .suggestion-heading{font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:4px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.02em;}
  .suggestion-text{font-size:13.5px;line-height:1.7;color:var(--gray);margin:0 0 22px;max-width:760px;}
  .role-tiles{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .role-tile{background:var(--dark2);border:1px solid var(--line);border-radius:14px;padding:20px 26px;text-align:left;min-width:140px;}
  .role-tile .n{font-size:30px;font-weight:900;color:var(--lime);line-height:1;margin-bottom:6px;}
  .role-tile .lbl{font-size:13px;font-weight:600;color:var(--off);}
  .tile-divider{width:1px;height:44px;background:var(--line);transform:rotate(18deg);}

  .catalog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0 24px;}
  .cat-card{background:var(--dark2);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .cat-photo{height:120px;position:relative;background:var(--dark3);}
  .cat-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .cat-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.65));}
  .cat-photo .cat-title{position:absolute;left:14px;bottom:10px;z-index:1;font-size:15px;font-weight:800;color:#fff;}
  .cat-card.no-photo .cat-title{position:static;padding:16px 16px 0;font-size:15px;font-weight:800;color:#fff;}
  .cat-tags{display:flex;flex-wrap:wrap;gap:6px;padding:14px 14px 16px;}
  .cat-tag{border:1px solid var(--lime);color:var(--lime);border-radius:999px;padding:5px 11px;font-size:10.5px;font-weight:700;}
  @media(max-width:900px){.catalog-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.catalog-grid{grid-template-columns:1fr;}}

  .cta-btn{display:block;width:100%;text-align:center;background:var(--lime);color:var(--dark);border-radius:14px;
    padding:18px;font-size:14.5px;font-weight:800;margin-top:8px;transition:.15s;}
  .cta-btn:hover{filter:brightness(1.06);}

  /* ---------- FOOTER ---------- */
  .footer-card{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
  .footer-card .kicker{margin-bottom:6px;}
  .footer-card .links{font-size:13px;color:var(--gray);}
  .footer-card .links a:hover{color:var(--lime);}
  .footer-card img{height:20px;opacity:.85;}

  .empty-state{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px;}
  .empty-state h1{font-size:20px;margin:0;}
  .empty-state p{color:var(--muted);font-size:13px;max-width:440px;margin:0;line-height:1.6;}
  .empty-state code{background:var(--dark2);padding:2px 6px;border-radius:5px;font-size:12px;}

  .section-hidden{display:none;}
  .footer-wordmark{display:none;align-items:center;font-weight:900;font-size:13px;color:#161616;}
  .footer-wordmark span{color:#8a9c00;}

  /* ---------- PRINT (zero-dependency fallback) ---------- */
  @media print{
    .sidebar-actions, .lang-toggle{display:none !important;}
    .app{display:block;}
    .sidebar{position:static;height:auto;border:none;}
    .main{max-width:100%;padding:20px;}
    body{background:#fff;color:#161616;}
    .card, .field-box, .pill-item, .role-tile, .cat-card{background:#f6f6f4;border-color:#ddd;}
    .card .dots{display:none;}
  }

  /* ---------- PDF EXPORT (html2canvas capture mode) ---------- */
  body.pdf-export{background:#ffffff;color:#161616;}
  body.pdf-export .sidebar-actions, body.pdf-export .lang-toggle, body.pdf-export .card .dots{display:none !important;}
  body.pdf-export .sidebar{position:static;height:auto;border-color:#e2e2e2;}
  body.pdf-export .app{display:block;}
  body.pdf-export .main{max-width:100%;padding:24px;}
  body.pdf-export .card, body.pdf-export .field-box, body.pdf-export .pill-item, body.pdf-export .role-tile, body.pdf-export .cat-card{
    background:#f6f6f4;border-color:#e2e2e2;}
  body.pdf-export .page-title, body.pdf-export .cover-name{color:#161616;}
  body.pdf-export .page-sub, body.pdf-export .narrative p, body.pdf-export .perf-body p, body.pdf-export .pill-item,
  body.pdf-export .metric-row .m-lbl, body.pdf-export .suggestion-text, body.pdf-export .field-box .val small,
  body.pdf-export .footer-card .links{color:#3a3a3a;}
  body.pdf-export .card .kicker, body.pdf-export .field-box .lbl, body.pdf-export .narrative h4{color:#5c6d00;}
  body.pdf-export .side-nav{display:none;}
  body.pdf-export .footer-card img{display:none;}
  body.pdf-export .footer-wordmark{display:inline-flex !important;}

  @media(max-width:960px){
    .app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:18px 20px;}
    .sidebar h1{display:none;}
    .side-nav{display:none;}
    .sidebar-actions{flex-direction:row;margin-top:0;margin-left:auto;}
    .main{padding:24px 20px 60px;}
    .cover-card{flex-direction:column;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   DATA SOURCE: Google Sheets (published as CSV) — one row per client review.
   Replace SHEET_CSV_URL below with your sheet's published CSV link:
   Google Sheets → File → Share → Publish to web → select your tab → CSV → Publish
   ========================================================================= */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSLjDMQ2TyBMuEmF7CoG1IhNq0dSfhPVCPC0ShjxUwJ-S3eH92IeSDPwIj_M3DpeS9UGVHb_MytG6kk/pubhtml";

const COLUMNS = ["client_slug","client_name","glofer_name","glofer_role","period","start_date","reports_to","schedule",
  "photo_url","review_type","team_text","project_text","highlight_1","highlight_2","highlight_3","highlight_4",
  "perf_text","stat_attendance","stat_online","stat_response","stat_escalations","autonomy","flexibility","seniority",
  "headsup_1","headsup_2","headsup_3","cross_note","cross_role_1","cross_role_1_n","cross_role_2","cross_role_2_n"];

/* ---------------- Minimal CSV parser (no external library) ---------------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || r[0]!=="");
}
function csvToRecords(text){
  const rows = parseCSV(text);
  if(rows.length < 1) return [];
  const header = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>c && c.trim())).map(r=>{
    const rec = {};
    header.forEach((h,i)=>{ rec[h] = (r[i]||"").trim(); });
    return rec;
  });
}

function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase() || "GL"; }
function slugify(s){ return (s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }

let ALL_RECORDS = [];
let currentLang = "es";

const DEFAULT_PHOTO = "https://raw.githubusercontent.com/comms-glofy/pr/refs/heads/main/glofers.png";
function resolvePhotoUrl(d){ return d.photo_url || DEFAULT_PHOTO; }

const CATALOG = [
  {key:"high", img:"https://raw.githubusercontent.com/comms-glofy/scope/refs/heads/main/high.jpg",
    en:"High Specialization", es:"Alta especialización", roles:["AI Engineer","ML Engineer","Python Engineer","Golang Engineer","Ruby Developer","DevOps Engineer"]},
  {key:"enterprise", img:"https://raw.githubusercontent.com/comms-glofy/scope/refs/heads/main/enterprise.jpg",
    en:"ERP / CRM / Enterprise", es:"ERP / CRM / Enterprise", roles:["SAP Consultant","Salesforce Developer","Oracle Developer","Dynamics 365 Developer","Odoo Developer"]},
  {key:"core-tech", img:"https://raw.githubusercontent.com/comms-glofy/scope/refs/heads/main/core-tech.jpg",
    en:"Core Tech", es:"Core Tech", roles:["Full Stack Developer","Back-End Developer","Front-End Developer","Mobile Developer","QA Automation Engineer"]},
  {key:"nodev", img:"https://raw.githubusercontent.com/comms-glofy/scope/refs/heads/main/nodev.jpg",
    en:"Digital No-Dev", es:"Digital No-Dev", roles:["UX/UI Designer","Growth Marketer","Data Analytics","Graphic Designer","Content Creator"]},
  {key:"sales", img:null,
    en:"Sales &amp; Revenue", es:"Sales &amp; Revenue", roles:["Sales Engineer / Solutions Consultant","SDR","BDR","Account Executive","Account Manager","Customer Success Manager","Sales Operations / RevOps"]}
];

const I18N = {
  es:{ title:"Informe de\nPerformance Review", navDatos:"Datos generales", navTeam:"Team and Project", navHl:"Highlights",
    navPerf:"Performance and Attitude", navHu:"Alineación con el cliente (Heads-up)", navCross:"Hacer crecer el equipo (Cross-sell)", navContact:"Contacto",
    downloadPdf:"Descargar PDF", printPdf:"Imprimir / Guardar como PDF",
    pageTitle:"PERFORMANCE REVIEW",
    pageSub:"Reunión mensual (luego trimestral) entre el comercial de Glofy y el cliente, para repasar cómo viene el recurso asignado. Se apoya en el informe completo que envía People, pero no se muestra el informe completo.",
    datosK:"Datos generales", rolLbl:"Rol", clienteLbl:"Cliente", periodoLbl:"Período cubierto", fechaLbl:"Fecha de inicio",
    reportaLbl:"Reporta", modalidadLbl:"Modalidad",
    teamK:"Team and Project", equipoLbl:"Equipo", proyectoLbl:"Proyecto",
    hlK:"Highlights",
    perfK:"Performance and Attitude", metricasLbl:"Métricas",
    m1:"Puntualidad", m2:"Cámara / online", m3:"Tiempo de respuesta promedio", m4:"Escalamientos",
    huK:"Alineación con el cliente (Heads-up)",
    crossK:"Hacer crecer el equipo (Cross-sell)", sugerenciaH:"Sugerencia de Glofy para nuevo talento",
    catalogoCta:"Catálogo completo y tarifas en glofy.co/scopes",
    contactoK:"Contacto",
    emptyH:"No hay ningún informe cargado", emptyP:"Verificá que la hoja de Google Sheets esté publicada y que el enlace esté bien configurado en el código, o que el cliente seleccionado exista en la planilla.",
    pdfError:"No se pudo generar el PDF. Probá con el botón de Imprimir / Guardar como PDF."
  },
  en:{ title:"Performance Review\nReport", navDatos:"General info", navTeam:"Team and Project", navHl:"Highlights",
    navPerf:"Performance and Attitude", navHu:"Client alignment (Heads-up)", navCross:"Grow the team (Cross-sell)", navContact:"Contact",
    downloadPdf:"Download PDF", printPdf:"Print / Save as PDF",
    pageTitle:"PERFORMANCE REVIEW",
    pageSub:"Monthly (then quarterly) meeting between the Glofy commercial and the client, to review how the assigned resource is doing. Draws on the full report People sends, but the full report is never shown.",
    datosK:"General info", rolLbl:"Role", clienteLbl:"Client", periodoLbl:"Period covered", fechaLbl:"Start date",
    reportaLbl:"Reports to", modalidadLbl:"Schedule",
    teamK:"Team and Project", equipoLbl:"Team", proyectoLbl:"Project",
    hlK:"Highlights",
    perfK:"Performance and Attitude", metricasLbl:"Metrics",
    m1:"On-time attendance", m2:"Camera-on / online", m3:"Avg. response time", m4:"Escalations",
    huK:"Client alignment (Heads-up)",
    crossK:"Grow the team (Cross-sell)", sugerenciaH:"Glofy's suggestion for new talent",
    catalogoCta:"Full catalog and rates at glofy.co/scopes",
    contactoK:"Contact",
    emptyH:"No review loaded", emptyP:"Check that the Google Sheet is published and the link is set correctly in the code, or that the selected client exists in the sheet.",
    pdfError:"Could not generate the PDF. Try the Print / Save as PDF button instead."
  }
};

function currentSlug(){ return new URLSearchParams(location.search).get("client"); }

async function boot(){
  renderShell(null, []);
  if(SHEET_CSV_URL.indexOf("PASTE_YOUR") === 0){
    renderShell(null, [], "config");
    return;
  }
  try{
    const res = await fetch(SHEET_CSV_URL, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text = await res.text();
    ALL_RECORDS = csvToRecords(text);
  }catch(err){
    console.error("Could not load sheet", err);
    renderShell(null, [], "fetch");
    return;
  }
  const slug = currentSlug() || (ALL_RECORDS[0] && ALL_RECORDS[0].client_slug);
  const record = ALL_RECORDS.find(r => r.client_slug === slug) || ALL_RECORDS[0] || null;
  renderShell(record, ALL_RECORDS);
}

function renderShell(record, records, errorType){
  const app = document.getElementById("app");
  if(!record){
    const t = I18N[currentLang];
    let msg = t.emptyP;
    if(errorType === "config") msg = currentLang==="es"
      ? "Todavía no se configuró la hoja de Google Sheets en el código (SHEET_CSV_URL)."
      : "The Google Sheet hasn't been configured yet in the code (SHEET_CSV_URL).";
    if(errorType === "fetch") msg = currentLang==="es"
      ? "No se pudo leer la hoja de Google Sheets. Confirmá que esté publicada (File → Share → Publish to web → CSV)."
      : "Could not read the Google Sheet. Confirm it's published (File → Share → Publish to web → CSV).";
    app.innerHTML = `
      <div class="app">
        <div class="main" style="max-width:100%;">
          <div class="empty-state">
            <h1>${t.emptyH}</h1>
            <p>${msg}</p>
          </div>
        </div>
      </div>`;
    return;
  }
  renderPage(record, records);
}

function renderPage(d, records){
  const t = I18N[currentLang];
  const isFirst = d.review_type === "first";
  const stats = [
    [d.stat_attendance, t.m1], [d.stat_online, t.m2], [d.stat_response, t.m3], [d.stat_escalations, t.m4]
  ];
  const autonomy = Number(d.autonomy)||0, flex = Number(d.flexibility)||0, seniority = Number(d.seniority)||0;

  const clientOptions = records.map(r=>`<option value="${esc(r.client_slug)}" ${r.client_slug===d.client_slug?"selected":""}>${esc(r.client_name||r.client_slug)}</option>`).join("");

  const highlights = [d.highlight_1,d.highlight_2,d.highlight_3,d.highlight_4].filter(Boolean);
  const headsups = [d.headsup_1,d.headsup_2,d.headsup_3].filter(Boolean);
  const roleTiles = [];
  if(d.cross_role_1) roleTiles.push([d.cross_role_1_n||"+1", d.cross_role_1]);
  if(d.cross_role_2) roleTiles.push([d.cross_role_2_n||"+1", d.cross_role_2]);

  document.getElementById("app").innerHTML = `
  <div class="app">
    <aside class="sidebar">
      <img class="logo" src="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/logo-rebrand-glofy.png" alt="Glofy">
      <h1>${t.title.split("\n").map(esc).join("<br>")}</h1>
      <nav class="side-nav">
        <a href="#datos" data-sec="datos" class="active">${t.navDatos}</a>
        <a href="#team" data-sec="team" class="${isFirst?"":"hidden-link"}">${t.navTeam}</a>
        <a href="#highlights" data-sec="highlights">${t.navHl}</a>
        <a href="#performance" data-sec="performance">${t.navPerf}</a>
        <a href="#alineacion" data-sec="alineacion" class="${headsups.length?"":"hidden-link"}">${t.navHu}</a>
        <a href="#cross" data-sec="cross">${t.navCross}</a>
        <a href="#contacto" data-sec="contacto">${t.navContact}</a>
      </nav>
      <div class="sidebar-actions">
        <label class="mini">${t.clienteLbl}</label>
        <select id="clientSelect">${clientOptions}</select>
        <div class="lang-toggle" style="margin-top:10px;"><button id="esBtn" class="${currentLang==="es"?"active":""}">ES</button><button id="enBtn" class="${currentLang==="en"?"active":""}">EN</button></div>
        <button class="btn primary" id="pdfBtn" style="margin-top:8px;">↓ <span id="pdfBtnLabel">${t.downloadPdf}</span></button>
        <button class="btn ghost" id="printBtn" style="font-size:11px;">${t.printPdf}</button>
      </div>
    </aside>

    <main class="main">
      <div class="page-title">${t.pageTitle}</div>
      <p class="page-sub">${t.pageSub}</p>

      <section class="card cover-card" id="datos">
        <div class="cover-photo" id="coverPhotoWrap">
          <img id="coverPhotoImg" src="${esc(resolvePhotoUrl(d))}" crossorigin="anonymous" onerror="this.style.display='none'; document.getElementById('coverPhotoFallback').style.display='flex';">
          <div class="ph-fallback" id="coverPhotoFallback" style="display:none;">${initials(d.glofer_name)}</div>
        </div>
        <div class="cover-right">
          <div class="kicker">${t.datosK}</div>
          <div class="cover-name">${esc(d.glofer_name)}</div>
          <div class="field-grid">
            <div class="field-box"><div class="lbl">${t.rolLbl}</div><div class="val">${esc(d.glofer_role)}</div></div>
            <div class="field-box"><div class="lbl">${t.fechaLbl}</div><div class="val">${esc(d.start_date)}</div></div>
            <div class="field-box"><div class="lbl">${t.clienteLbl}</div><div class="val">${esc(d.client_name)}</div></div>
            <div class="field-box"><div class="lbl">${t.reportaLbl}</div><div class="val">${esc(d.reports_to)}</div></div>
            <div class="field-box"><div class="lbl">${t.periodoLbl}</div><div class="val">${esc(d.period)}</div></div>
            <div class="field-box"><div class="lbl">${t.modalidadLbl}</div><div class="val">${esc(d.schedule)}</div></div>
          </div>
        </div>
      </section>

      <div class="masonry">
        <section class="card ${headsups.length?"":"section-hidden"}" id="alineacion">
          <div class="dots">⋮</div>
          <div class="kicker">${t.huK}</div>
          <div class="pill-list">${headsups.map(h=>`<div class="pill-item">${esc(h)}</div>`).join("")}</div>
        </section>

        <section class="card" id="highlights">
          <div class="dots">⋮</div>
          <div class="kicker">${t.hlK}</div>
          <div class="pill-list">${highlights.map(h=>`<div class="pill-item">${esc(h)}</div>`).join("")}</div>
        </section>

        <section class="card perf-body" id="performance">
          <div class="dots">⋮</div>
          <div class="kicker">${t.perfK}</div>
          <p>${esc(d.perf_text)}</p>
          <div class="kicker" style="margin-top:18px;">${t.metricasLbl}</div>
          ${stats.map(([val,lbl])=>`
          <div class="metric-row">
            <div class="m-lbl">${lbl}</div>
            <div class="metric-track"><i data-target="${escPct(val)}"></i></div>
            <div class="m-val">${esc(val)}</div>
          </div>`).join("")}
        </section>

        <section class="card narrative ${isFirst?"":"section-hidden"}" id="team">
          <div class="dots">⋮</div>
          <div class="kicker">${t.teamK}</div>
          <h4>${t.equipoLbl}</h4><p>${esc(d.team_text)}</p>
          <h4>${t.proyectoLbl}</h4><p>${esc(d.project_text)}</p>
        </section>
      </div>

      <section class="card" id="cross">
        <div class="dots">⋮</div>
        <div class="kicker">${t.crossK}</div>
        ${d.cross_note ? `
        <div class="suggestion-heading">${t.sugerenciaH}</div>
        <p class="suggestion-text">${esc(d.cross_note)}</p>
        ${roleTiles.length ? `<div class="role-tiles">${roleTiles.map(([n,lbl],i)=>`${i>0?'<div class="tile-divider"></div>':''}<div class="role-tile"><div class="n">${esc(n)}</div><div class="lbl">${esc(lbl)}</div></div>`).join("")}</div>` : ``}
        ` : ``}

        <div class="catalog-grid" style="margin-top:${d.cross_note?'26px':'6px'};">
          ${CATALOG.map(cat=>`
          <div class="cat-card ${cat.img?"":"no-photo"}">
            ${cat.img ? `<div class="cat-photo"><img src="${cat.img}" crossorigin="anonymous" onerror="this.parentElement.style.display='none'"><div class="cat-title">${cat[currentLang]}</div></div>` : `<div class="cat-title">${cat[currentLang]}</div>`}
            <div class="cat-tags">${cat.roles.map(r=>`<span class="cat-tag">${esc(r)}</span>`).join("")}</div>
          </div>`).join("")}
        </div>
        <a class="cta-btn" href="https://glofy.co/scopes" target="_blank">${t.catalogoCta}</a>
      </section>

      <section class="card footer-card" id="contacto">
        <div>
          <div class="kicker">${t.contactoK}</div>
          <div class="links"><a href="mailto:hello@glofy.co">hello@glofy.co</a> &nbsp;·&nbsp; <a href="https://glofy.co" target="_blank">glofy.co</a></div>
        </div>
        <img src="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/logo-rebrand-glofy.png" alt="Glofy">
        <span class="footer-wordmark">GLO<span>FY</span></span>
      </section>
    </main>
  </div>`;

  wireInteractivity(d, records);
  animateMetrics();
  renderRadarless(autonomy, flex, seniority); // placeholder no-op kept for future use
}

function escPct(v){
  const n = parseFloat(String(v).replace("%","").replace("<","").replace("h",""));
  if(isNaN(n)) return 60;
  if(String(v).includes("%")) return Math.max(4, Math.min(100, n));
  return 70; // non-numeric metrics (e.g. "Diaria", "<2h") show a fixed indicative bar
}
function animateMetrics(){
  document.querySelectorAll(".metric-track i").forEach(el=>{
    requestAnimationFrame(()=>{ el.style.width = el.dataset.target + "%"; });
  });
}
function renderRadarless(){ /* no-op — this design uses metric bars, not a radar, per the approved PDF */ }

function wireInteractivity(d, records){
  document.getElementById("esBtn").onclick = ()=>{ currentLang="es"; renderPage(d, records); };
  document.getElementById("enBtn").onclick = ()=>{ currentLang="en"; renderPage(d, records); };
  document.getElementById("clientSelect").onchange = (e)=>{
    const url = new URL(location); url.searchParams.set("client", e.target.value); history.replaceState(null,"",url);
    const rec = records.find(r=>r.client_slug===e.target.value);
    if(rec) renderPage(rec, records);
  };

  const links = document.querySelectorAll(".side-nav a:not(.hidden-link)");
  const sections = Array.from(links).map(a=>document.getElementById(a.dataset.sec)).filter(Boolean);
  const spy = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        links.forEach(l=>l.classList.remove("active"));
        const match = document.querySelector(`.side-nav a[data-sec="${entry.target.id}"]`);
        if(match) match.classList.add("active");
      }
    });
  }, {rootMargin:"-20% 0px -70% 0px"});
  sections.forEach(s=>spy.observe(s));

  document.getElementById("printBtn").onclick = ()=>window.print();

  document.getElementById("pdfBtn").onclick = async ()=>{
    const btn = document.getElementById("pdfBtn");
    btn.disabled = true;
    document.body.classList.add("pdf-export");
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    try{
      const canvas = await html2canvas(document.querySelector(".app"), { backgroundColor:"#ffffff", scale:2, useCORS:true });
      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      const { jsPDF } = window.jspdf;
      const pdfWidthPt = 800;
      const pdfHeightPt = canvas.height * (pdfWidthPt / canvas.width);
      const pdf = new jsPDF({ unit:"pt", format:[pdfWidthPt, pdfHeightPt] });
      pdf.addImage(imgData, "JPEG", 0, 0, pdfWidthPt, pdfHeightPt);
      pdf.save(`glofy-performance-review-${slugify(d.client_name)||d.client_slug}.pdf`);
    }catch(err){
      console.error(err);
      alert(I18N[currentLang].pdfError);
    }finally{
      document.body.classList.remove("pdf-export");
      btn.disabled = false;
    }
  };
}

boot();
</script>
</body>
</html>
