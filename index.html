<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glofy · Performance Review</title>
<link rel="icon" href="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{ --dark:#1c1c1c; --dark2:#2a2a2a; --dark3:#242424; --lime:#ceff00; --gray:#e1e1e1; --off:#ededed;
    --line:rgba(225,225,225,0.12); --muted:rgba(237,237,237,0.55); --sidebar-w:270px; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--dark);color:var(--off);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--lime);color:var(--dark);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

  /* ---------- LAYOUT ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;
    padding:32px 26px;border-right:1px solid var(--line);display:flex;flex-direction:column;
  }
  .sidebar img.logo{height:22px;width:auto;display:block;margin-bottom:26px;align-self:flex-start;}
  .sidebar h1{font-size:20px;font-weight:800;line-height:1.25;margin:0 0 30px;}
  .side-nav{display:flex;flex-direction:column;gap:15px;margin-bottom:auto;}
  .side-nav a{font-size:13.5px;color:var(--muted);font-weight:500;transition:.15s;align-self:flex-start;}
  .side-nav a:hover{color:var(--gray);}
  .side-nav a.active{color:#fff;font-weight:700;}
  .side-nav a.hidden-link{display:none;}
  .sidebar-actions-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease;margin-top:26px;}
  .sidebar-actions-wrap.collapsed{grid-template-rows:0fr;margin-top:0;}
  .sidebar-actions{display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:0;}
  .main{flex:1;min-width:0;padding:40px 44px 90px;max-width:1180px;}

  .btn{border:1px solid var(--line);background:var(--dark2);color:var(--off);border-radius:999px;padding:10px 16px;
    font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s ease;align-self:flex-start;width:100%;}
  .btn:hover{border-color:var(--lime);}
  .btn.primary{background:var(--lime);color:var(--dark);border-color:var(--lime);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5;cursor:progress;}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;align-self:flex-start;}
  .lang-toggle button{background:transparent;border:none;color:var(--muted);padding:8px 12px;font-size:11px;font-weight:700;}
  .lang-toggle button.active{background:var(--lime);color:var(--dark);}
  select.sel{width:100%;appearance:none;background:var(--dark2);color:var(--off);border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;font-size:12px;font-weight:600;margin-top:6px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;}
  .sidebar label.mini{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;align-self:flex-start;}

  .collapse-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:22px;
    background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:7px;
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  }
  .collapse-toggle:hover{border-color:var(--lime);color:var(--lime);}
  .collapse-toggle .chev{transition:transform .3s ease;display:inline-block;}
  .collapse-toggle.collapsed .chev{transform:rotate(180deg);}

  .page-title{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin:0 0 4px;text-transform:uppercase;}
  .edit-hint{font-size:12px;color:var(--muted);margin:0 0 26px;}

  /* ---------- CARD ---------- */
  .card{position:relative;background:var(--dark3);border:1px solid var(--line);border-radius:22px;padding:26px 26px 24px;margin-bottom:18px;}
  .card .kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:14px;}

  /* ---------- shared input styling (visibly editable) ---------- */
  .in{background:transparent;border:none;border-bottom:1px dashed rgba(206,255,0,0.4);color:var(--off);font-family:inherit;width:100%;padding:2px 0 3px;font-weight:700;font-size:inherit;cursor:text;transition:.15s ease;}
  .in:hover{background:rgba(206,255,0,0.06);}
  .in:focus{outline:none;background:rgba(206,255,0,0.1);border-bottom:1px solid var(--lime);}
  .in::placeholder{color:var(--muted);font-weight:500;}
  select.in{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 4px) 55%,calc(100% - 0px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:14px;}
  input[type=date].in, input[type=month].in{color-scheme:dark;}
  textarea.auto-grow{resize:none;overflow:hidden;display:block;min-height:20px;}
  textarea.in{border:1px dashed rgba(206,255,0,0.3);border-radius:8px;padding:8px 10px;}
  textarea.in:hover{background:rgba(206,255,0,0.05);}
  textarea.in:focus{border:1px solid var(--lime);background:rgba(206,255,0,0.08);}

  /* ---------- DATOS GENERALES ---------- */
  .cover-card{display:flex;gap:24px;align-items:stretch;}
  .cover-photo{width:220px;flex:none;border-radius:16px;overflow:hidden;background:var(--dark2);position:relative;}
  .cover-photo img{width:100%;height:100%;object-fit:cover;display:block;min-height:220px;}
  .photo-edit-btn{
    position:absolute;bottom:10px;right:10px;width:34px;height:34px;border-radius:50%;
    background:rgba(28,28,28,0.85);border:1px solid var(--line);color:var(--off);
    display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s ease;cursor:pointer;
  }
  .cover-photo:hover .photo-edit-btn, .photo-edit-btn:focus-within{opacity:1;}
  .photo-edit-btn:hover{border-color:var(--lime);color:var(--lime);}
  .photo-edit-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  body.presenting .photo-edit-btn{display:none;}
  .cover-right{flex:1;min-width:0;}
  .cover-name-input{font-size:28px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0 0 18px;width:100%;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-box{background:var(--dark2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .field-box .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:5px;}
  .field-box .val{font-size:15px;}
  @media(max-width:760px){.cover-card{flex-direction:column;}.cover-photo{width:100%;}}

  /* ---------- MASONRY GRID ---------- */
  .masonry{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-bottom:18px;}
  .masonry .card{margin-bottom:0;}
  @media(max-width:820px){.masonry{grid-template-columns:1fr;}}

  .pill-list{display:flex;flex-direction:column;gap:10px;}
  .pill-item{background:var(--dark2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .pill-item .in{font-size:13px;line-height:1.5;font-weight:500;color:var(--gray);}

  .narrative h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:16px 0 6px;}
  .narrative h4:first-child{margin-top:0;}
  .narrative textarea.in{font-size:13.5px;line-height:1.65;color:var(--gray);font-weight:500;min-height:64px;}

  .perf-body textarea.in{font-size:13.5px;line-height:1.7;color:var(--gray);font-weight:500;min-height:70px;margin-bottom:18px;}
  .metric-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .metric-row .m-lbl{width:150px;flex:none;font-size:12.5px;color:var(--gray);}
  .metric-track{flex:1;height:5px;background:var(--dark2);border-radius:3px;overflow:hidden;position:relative;}
  .metric-track i{display:block;height:100%;background:var(--lime);border-radius:3px;transition:width .3s ease;}
  .metric-row input[type=range]{position:absolute;inset:-8px 0;width:100%;height:20px;opacity:0;cursor:pointer;margin:0;}
  .metric-row .m-val{width:44px;text-align:right;flex:none;font-size:13px;font-weight:800;color:var(--lime);}

  /* ---------- GROW THE TEAM: marketing spotlight ---------- */
  .spotlight-head{font-size:19px;font-weight:800;line-height:1.35;margin:0 0 20px;max-width:600px;}
  .spotlight-head b{color:var(--lime);}
  .spotlight-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:8px;}
  .spotlight-card{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);transition:.2s ease;background:var(--dark2);}
  .spotlight-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,0.4);border-color:var(--lime);}
  .spotlight-photo{position:relative;height:160px;}
  .spotlight-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .spotlight-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(28,28,28,0.05) 40%, rgba(28,28,28,0.9) 100%);}
  .spotlight-photo .sp-tag{position:absolute;left:18px;bottom:14px;z-index:1;display:inline-block;background:var(--lime);color:var(--dark);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;}
  .spotlight-body{padding:20px;}
  .spotlight-body .sp-title{font-size:20px;font-weight:900;color:#fff;margin-bottom:14px;letter-spacing:-.01em;}
  .sp-benefits{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;}
  .sp-benefits li{display:flex;gap:9px;font-size:12.5px;line-height:1.5;color:var(--gray);}
  .sp-benefits li::before{content:"✓";flex:none;color:var(--lime);font-weight:800;}
  @media(max-width:760px){.spotlight-grid{grid-template-columns:1fr;}}

  .cta-btn{display:block;width:100%;text-align:center;background:var(--lime);color:var(--dark);border-radius:14px;
    padding:18px;font-size:14.5px;font-weight:800;margin-top:8px;transition:.15s;}
  .cta-btn:hover{filter:brightness(1.06);}

  /* ---------- FOOTER ---------- */
  .footer-card{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
  .footer-card .links{font-size:13px;color:var(--gray);}
  .footer-card .links a:hover{color:var(--lime);}
  .footer-card img{height:20px;width:auto;opacity:.85;align-self:center;}
  .footer-wordmark{display:none;align-items:center;font-weight:900;font-size:13px;color:#161616;}
  .footer-wordmark span{color:#8a9c00;}

  .review-type-seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:100%;margin-top:6px;}
  .review-type-seg button{flex:1;background:transparent;border:none;color:var(--muted);padding:8px 6px;font-size:11px;font-weight:700;}
  .review-type-seg button.active{background:var(--off);color:var(--dark);}

  .empty-state{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px;}
  .empty-state h1{font-size:20px;margin:0;}
  .empty-state p{color:var(--muted);font-size:13px;max-width:440px;margin:0;line-height:1.6;}

  .section-hidden{display:none;}
  .field-optional-hidden{display:none !important;}

  /* ---------- PRESENTING MODE ---------- */
  body.presenting .in{border-color:transparent !important;pointer-events:none;cursor:default;}
  body.presenting .in:hover{background:none;}
  body.presenting .in:focus{background:none;}
  body.presenting textarea.in{border:none !important;padding:0;}
  body.presenting .metric-row input[type=range]{pointer-events:none;}
  body.presenting .edit-hint{display:none;}

  /* ---------- PDF EXPORT (light theme for the off-screen text-only snapshot) ---------- */
  body.pdf-export{background:#ffffff;}
  #pdfSnapshot{color:#161616;}
  #pdfSnapshot .card, #pdfSnapshot .field-box, #pdfSnapshot .pill-item, #pdfSnapshot .cat-card{
    background:#f6f6f4;border-color:#e2e2e2;}
  #pdfSnapshot .page-title, #pdfSnapshot .cover-name-input{color:#161616;}
  #pdfSnapshot .card{color:#3a3a3a;}
  #pdfSnapshot .card .kicker, #pdfSnapshot .field-box .lbl, #pdfSnapshot .narrative h4{color:#5c6d00;}
  #pdfSnapshot .footer-card .links{color:#3a3a3a;}
  #pdfSnapshot .m-lbl{color:#3a3a3a;}
  #pdfSnapshot .cta-btn{color:#1c1c1c;}

  @media(max-width:960px){
    .app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:18px 20px;}
    .sidebar h1{display:none;}
    .side-nav{display:none;}
    .sidebar-actions{flex-direction:row;flex-wrap:wrap;margin-top:0;margin-left:auto;}
    .btn{width:auto;}
    .main{padding:24px 20px 60px;}
    .cover-card{flex-direction:column;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   Multi-level self-contained system:
   Client -> Talent (a client can have several Glofers, each with their own
   review history) -> PR record (one per period/month, kept as history so
   past reviews are never overwritten). Everything saved to this browser's
   localStorage. No Google Sheets, no separate setup page, no photo upload.
   ========================================================================= */

const STORE_PREFIX = "glofy_pr_v3_";
const FIELDS = ["client_name","glofer_name","glofer_role","start_date","period_from","period_to","reports_to","schedule",

  "metric_attendance","metric_online","metric_response","metric_escalations",
  "headsup_1","headsup_2","headsup_3"];

  project_text:"Northwind Logistics está migrando su sistema de tracking de envíos a una arquitectura de microservicios. El rol cubre el desarrollo del servicio de rastreo en tiempo real y la integración con el proveedor de GPS.",
  highlight_1:"Entregó el primer microservicio de tracking dos semanas antes de la fecha estimada.",
  highlight_2:"Resolvió un bug de sincronización de datos que afectaba a tres clientes internos.",
  highlight_3:"Documentó el proceso de integración con el proveedor de GPS.",
  highlight_4:"",
  perf_text:"Está online durante el horario acordado con la cámara prendida en las daily y en las reuniones de planning. Responde consultas por Slack dentro de las dos horas. No tuvo ausencias ni tardanzas en el período.",
  metric_attendance:"100", metric_online:"95", metric_response:"85", metric_escalations:"100",
  headsup_1:"", headsup_2:"", headsup_3:"", photo_data:""
};
/* Fields that carry over automatically when starting a new PR for an existing talent.
   context that rarely changes month to month. Everything else starts blank. */
const CARRY_OVER_FIELDS = ["client_name","glofer_name","glofer_role","start_date","reports_to","schedule","team_text","project_text","photo_data"];

const CATALOG = [
  {key:"high", img:"https://raw.githubusercontent.com/comms-glofy/scope/refs/heads/main/high.jpg",
    title:"High Specialization", roles:["AI Engineer","ML Engineer","Python Engineer","Golang Engineer","Ruby Developer","DevOps Engineer"]},
  {key:"enterprise", img:"https://raw.githubusercontent.com/comms-glofy/scope/refs/heads/main/enterprise.jpg",
    title:"ERP / CRM / Enterprise", roles:["SAP Consultant","Salesforce Developer","Oracle Developer","Dynamics 365 Developer","Odoo Developer"]},
  {key:"core-tech", img:"https://raw.githubusercontent.com/comms-glofy/scope/refs/heads/main/core-tech.jpg",
    title:"Core Tech", roles:["Full Stack Developer","Back-End Developer","Front-End Developer","Mobile Developer","QA Automation Engineer"]},
  {key:"nodev", img:"https://raw.githubusercontent.com/comms-glofy/scope/refs/heads/main/nodev.jpg",
    title:"Digital No-Dev", roles:["UX/UI Designer","Growth Marketer","Data Analytics","Graphic Designer","Content Creator"]},
  {key:"sales", img:"https://raw.githubusercontent.com/comms-glofy/pr/refs/heads/main/sales.png",
    title:"Sales &amp; Revenue", roles:["Sales Engineer / Solutions Consultant","SDR","BDR","Account Executive","Account Manager","Customer Success Manager","Sales Operations / RevOps"]}
];
/* The two lines Marketing wants spotlighted at the top of "Grow the team" */
const SPOTLIGHT_KEYS = ["nodev","sales"];

const SECTION_TITLES = {
  datos:"General Info", team:"Team and Project", highlights:"Highlights", performance:"Performance and Attitude",
  alineacion:"Heads-up (Client Alignment)", cross:"Grow the team", contacto:"Contact"
};

const I18N = {
  es:{ downloadPdf:"Descargar PDF",
    clienteLbl:"Cliente", newClientOpt:"+ Nuevo cliente…", newClientPrompt:"Nombre del cliente:",
    talentoLbl:"Talento", newTalentOpt:"+ Nuevo talento…", newTalentPrompt:"Nombre del Glofer para este nuevo talento:",
    prLbl:"Período (historial)", newPrOpt:"+ Nueva PR de este mes…",
    reviewTypeLbl:"Tipo de review", firstReview:"Primera", recurringReview:"Recurrente",
    modeLbl:"Vista", editModeBtn:"Completar", presentModeBtn:"Presentar", hideControls:"Ocultar controles", showControls:"Mostrar controles",
    pageTitle:"PERFORMANCE REVIEW", editHint:"Hacé clic en cualquier campo para editarlo. Se guarda solo.",
    rolLbl:"Rol", clienteFieldLbl:"Cliente", periodoLbl:"Período cubierto", fechaLbl:"Fecha de inicio", reportaLbl:"Reporta", modalidadLbl:"Modalidad",

    spTag1:"Talento digital", spTitle1:"Digital No-Dev",

    sp1b2:"Un solo proveedor concentra todo el equipo digital, con la misma gestión y reporting.",

    reviewTypeLbl:"Review type", firstReview:"First", recurringReview:"Recurring",
    modeLbl:"View", editModeBtn:"Fill in", presentModeBtn:"Present", hideControls:"Hide controls", showControls:"Show controls",
    pageTitle:"PERFORMANCE REVIEW", editHint:"Click any field to edit it. It saves automatically.",
    rolLbl:"Role", clienteFieldLbl:"Client", periodoLbl:"Period covered", fechaLbl:"Start date", reportaLbl:"Reports to", modalidadLbl:"Schedule",
    fullTime:"Full time", partTime:"Part time",
    equipoLbl:"Team", proyectoLbl:"Project",
    m1:"On-time attendance", m2:"Camera-on / online", m3:"Response time", m4:"Escalation-free rate",
    spotlightHead:'<b>Glofy</b> also covers Digital No-Dev and Sales &amp; Revenue, with the same senior talent standard.',
    spTag1:"Digital talent", spTitle1:"Digital No-Dev",
    sp1b1:"Add design, growth and content without opening a separate technical search.",
    sp1b2:"One single provider covers your entire digital team, under the same management and reporting.",

    spTag2:"Revenue team", spTitle2:"Sales &amp; Revenue",
    sp2b1:"Cover the full commercial funnel, from SDR to Customer Success, as one team.",
    sp2b2:"Add sales capacity without growing your internal structure.",
    sp2b3:"Start operating in weeks, with senior, immediately available talent.",
    catalogoCta:"Full catalog and rates at glofy.co/scopes",
    highlightPh:"Write a highlight…", headsupPh:"Write an alignment point…",
    emptyH:"No review loaded in this browser", emptyP:"Create one from the client selector in the sidebar.",
    pdfError:"Could not generate the PDF."
  }
};

let currentLang = "es";
let mode = "edit";
let controlsCollapsed = false;

function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slugify(s){ return (s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "x"; }
function shortId(){ return Date.now().toString(36).slice(-6); }

/* ---------------- storage: key = STORE_PREFIX + clientSlug + "::" + talentSlug + "::" + prId ---------------- */
function allKeys(){ return Object.keys(localStorage).filter(k=>k.startsWith(STORE_PREFIX)); }
function parseKey(key){ const [clientSlug,talentSlug,prId] = key.slice(STORE_PREFIX.length).split("::"); return {clientSlug,talentSlug,prId}; }
function buildKey(clientSlug,talentSlug,prId){ return STORE_PREFIX + clientSlug + "::" + talentSlug + "::" + prId; }
function loadByKey(key){ try{ const raw=localStorage.getItem(key); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function saveByKey(key, data){ try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){ console.error("save failed", e); } }

function listClients(){
  const map = new Map();
  allKeys().forEach(k=>{
    const {clientSlug} = parseKey(k);
    if(!map.has(clientSlug)){
      const d = loadByKey(k);
      map.set(clientSlug, (d && d.client_name) ? d.client_name : clientSlug);
    }
  });
  return Array.from(map.entries()).map(([slug,name])=>({slug,name}));
}
function listTalents(clientSlug){
  const map = new Map();
  allKeys().forEach(k=>{
    const parts = parseKey(k);
    if(parts.clientSlug !== clientSlug) return;
    if(!map.has(parts.talentSlug)){
      const d = loadByKey(k);
      map.set(parts.talentSlug, (d && d.glofer_name) ? d.glofer_name : parts.talentSlug);
    }
  });
  return Array.from(map.entries()).map(([slug,name])=>({slug,name}));
}
function listPRs(clientSlug, talentSlug){
  const out = [];
  allKeys().forEach(k=>{
    const parts = parseKey(k);
    if(parts.clientSlug !== clientSlug || parts.talentSlug !== talentSlug) return;
    const d = loadByKey(k);
    if(d) out.push({key:k, prId:parts.prId, updatedAt:d.updated_at||0, periodFrom:d.period_from||""});
  });
  out.sort((a,b)=> b.updatedAt - a.updatedAt);
  return out;
}
function mostRecentKeyForClient(clientSlug){
  const talents = listTalents(clientSlug);
  let best=null, bestTime=-1;
  talents.forEach(t=>{
    listPRs(clientSlug, t.slug).forEach(pr=>{ if(pr.updatedAt>=bestTime){bestTime=pr.updatedAt; best=pr.key;} });
  });
  return best;
}
function mostRecentClientSlug(){
  let best=null, bestTime=-1;
  listClients().forEach(c=>{
    listTalents(c.slug).forEach(t=>{
      listPRs(c.slug, t.slug).forEach(pr=>{ if(pr.updatedAt>=bestTime){bestTime=pr.updatedAt; best=c.slug;} });
    });
  });
  return best;
}
function mostRecentTalentSlug(clientSlug){
  let best=null, bestTime=-1;
  listTalents(clientSlug).forEach(t=>{
    listPRs(clientSlug, t.slug).forEach(pr=>{ if(pr.updatedAt>=bestTime){bestTime=pr.updatedAt; best=t.slug;} });
  });
  return best;
}

function monthLabel(ym, lang){
  if(!ym) return "";
  const [y,m] = ym.split("-").map(Number);
  const d = new Date(y, (m||1)-1, 1);
  return d.toLocaleDateString(lang==="es" ? "es-AR" : "en-US", {month:"short", year:"numeric"});
}
function periodDisplay(d, lang){
  const a = monthLabel(d.period_from, lang), b = monthLabel(d.period_to, lang);
  if(a && b) return a + " – " + b;
  return a || b || "";
}
function dateDisplay(iso, lang){
  if(!iso) return "";
  const [y,m,day] = iso.split("-");
  return lang==="es" ? `${day}/${m}/${y}` : `${m}/${day}/${y}`;
}
function currentMonthStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }

function boot(){
  const params = new URLSearchParams(location.search);
  let clientSlug = params.get("client");
  let talentSlug = params.get("talent");
  let prKey = params.get("pr");

  if(allKeys().length === 0){
    // seed a demo record so the tool is never empty on first load
    clientSlug = slugify(DEFAULTS.client_name);
    talentSlug = slugify(DEFAULTS.glofer_name);
    const prId = DEFAULTS.period_from + "-" + shortId();
    const data = Object.assign({}, DEFAULTS, {updated_at:Date.now()});
    saveByKey(buildKey(clientSlug, talentSlug, prId), data);
    prKey = buildKey(clientSlug, talentSlug, prId);
  }

  if(!clientSlug) clientSlug = mostRecentClientSlug();
  if(clientSlug && !talentSlug) talentSlug = mostRecentTalentSlug(clientSlug);
  if(clientSlug && talentSlug && !prKey){
    const prs = listPRs(clientSlug, talentSlug);
    prKey = prs.length ? prs[0].key : null;
  }
  render(prKey);
}

function updateUrl(key){
  if(!key) return;
  const {clientSlug,talentSlug,prId} = parseKey(key);
  const url = new URL(location);
  url.searchParams.set("client", clientSlug);
  url.searchParams.set("talent", talentSlug);
  url.searchParams.set("pr", key);
  history.replaceState(null,"",url);
}

function autoGrow(el){ el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

function applyPresentingVisibility(d){
  const presenting = mode === "presenting";
  ["highlight_1","highlight_2","highlight_3","highlight_4","headsup_1","headsup_2","headsup_3"].forEach(k=>{
    const wrap = document.querySelector(`.pill-item[data-field="${k}"]`);
    if(!wrap) return;
    const empty = !(d[k] && d[k].trim());
    wrap.classList.toggle("field-optional-hidden", presenting && empty);
  });
  const anyHeadsup = [d.headsup_1,d.headsup_2,d.headsup_3].some(v=>v && v.trim());
  const card = document.getElementById("alineacion");
  const navLink = document.querySelector('.side-nav a[data-sec="alineacion"]');
  const shouldHide = presenting && !anyHeadsup;
  if(card) card.classList.toggle("field-optional-hidden", shouldHide);
  if(navLink) navLink.classList.toggle("hidden-link", shouldHide);
}

function wireInteractivity(prKey, d){
  const {clientSlug,talentSlug} = parseKey(prKey);

  function save(){
    FIELDS.forEach(f=>{ const el=document.getElementById(f); if(el) d[f] = el.value; });
    d.updated_at = Date.now();
    saveByKey(prKey, d);
    const clientOpt = document.querySelector(`#clientSelect option[value="${CSS.escape(clientSlug)}"]`);
    if(clientOpt) clientOpt.textContent = d.client_name || clientSlug;
    const talentOpt = document.querySelector(`#talentSelect option[value="${CSS.escape(talentSlug)}"]`);
    if(talentOpt) talentOpt.textContent = d.glofer_name || talentSlug;
  }

  document.querySelectorAll(".card input.in, .card textarea.in, .card select.in").forEach(el=>{
    if(el.type === "range") return;
    el.addEventListener("input", save);
    el.addEventListener("change", save);
    if(el.classList.contains("auto-grow")) el.addEventListener("input", ()=>autoGrow(el));
  });

  ["metric_attendance","metric_online","metric_response","metric_escalations"].forEach(key=>{
    const range = document.getElementById(key);
    range.addEventListener("input", ()=>{
      document.getElementById(key+"_bar").style.width = range.value + "%";
      document.getElementById(key+"_val").textContent = range.value + "%";
      save();
    });
  });

  document.getElementById("esBtn").onclick = ()=>{ save(); currentLang="es"; render(prKey); };
  document.getElementById("enBtn").onclick = ()=>{ save(); currentLang="en"; render(prKey); };

  document.querySelectorAll("#modeSeg button").forEach(b=>{
    b.onclick = ()=>{ save(); mode = b.dataset.v; render(prKey); };
  });
  document.querySelectorAll("#reviewTypeSeg button").forEach(b=>{
    b.onclick = ()=>{ d.review_type = b.dataset.v; d.updated_at = Date.now(); saveByKey(prKey, d); render(prKey); };
  });

  document.getElementById("clientSelect").onchange = (e)=>{
    if(e.target.value === "__new__"){
      const name = prompt(I18N[currentLang].newClientPrompt);
      if(!name){ render(prKey); return; }
      const newClientSlug = slugify(name) + "-" + shortId();
      const talentName = prompt(I18N[currentLang].newTalentPrompt);
      const newTalentSlug = slugify(talentName || "talent") + "-" + shortId();
      const prId = currentMonthStr() + "-" + shortId();
      const fresh = Object.assign({}, DEFAULTS, {client_name:name, glofer_name:talentName||"", glofer_role:"",
        team_text:"", project_text:"", highlight_1:"",highlight_2:"",highlight_3:"",highlight_4:"", perf_text:"",
        updated_at:Date.now()});
      const newKey = buildKey(newClientSlug, newTalentSlug, prId);
      saveByKey(newKey, fresh);
      render(newKey);
      return;
    }
    save();
    const newClientSlug = e.target.value;
    const t2 = mostRecentTalentSlug(newClientSlug);
    const prs = t2 ? listPRs(newClientSlug, t2) : [];
    render(prs.length ? prs[0].key : null);
  };

  document.getElementById("talentSelect").onchange = (e)=>{
    if(e.target.value === "__new__"){
      const name = prompt(I18N[currentLang].newTalentPrompt);
      if(!name){ render(prKey); return; }
      const newTalentSlug = slugify(name) + "-" + shortId();
      const prId = currentMonthStr() + "-" + shortId();
      const fresh = Object.assign({}, DEFAULTS, {client_name:d.client_name, glofer_name:name, glofer_role:"",
        team_text:"", project_text:"", highlight_1:"",highlight_2:"",highlight_3:"",highlight_4:"", perf_text:"",
        updated_at:Date.now()});
      const newKey = buildKey(clientSlug, newTalentSlug, prId);
      saveByKey(newKey, fresh);
      render(newKey);
      return;
    }
    save();
    const newTalentSlug = e.target.value;
    const prs = listPRs(clientSlug, newTalentSlug);
    render(prs.length ? prs[0].key : null);
  };

  document.getElementById("prSelect").onchange = (e)=>{
    if(e.target.value === "__new__"){
      const prId = currentMonthStr() + "-" + shortId();
      const fresh = { updated_at: Date.now() };
      CARRY_OVER_FIELDS.forEach(f=>{ fresh[f] = d[f]; });
      FIELDS.forEach(f=>{ if(fresh[f]===undefined) fresh[f] = DEFAULTS[f]!==undefined ? DEFAULTS[f] : ""; });
      fresh.review_type = "recurring";
      fresh.period_from = currentMonthStr();
      fresh.period_to = currentMonthStr();
      const newKey = buildKey(clientSlug, talentSlug, prId);
      saveByKey(newKey, fresh);
      render(newKey);
      return;
    }
    save();
    render(e.target.value);
  };

  const photoInput = document.getElementById("photoInput");
  if(photoInput){
    photoInput.addEventListener("change", (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        d.photo_data = reader.result;
        d.updated_at = Date.now();
        saveByKey(prKey, d);
        const img = document.getElementById("coverPhotoImg");
        img.removeAttribute("crossorigin");
        img.src = reader.result;
        img.style.display = "";
      };
      reader.readAsDataURL(file);
    });
  }

  const collapseBtn = document.getElementById("collapseToggle");
  const actionsEl = document.getElementById("sidebarActionsWrap");
  actionsEl.classList.toggle("collapsed", controlsCollapsed);
  collapseBtn.classList.toggle("collapsed", controlsCollapsed);
  document.getElementById("collapseLabel").textContent = controlsCollapsed ? I18N[currentLang].showControls : I18N[currentLang].hideControls;
  collapseBtn.onclick = ()=>{
    controlsCollapsed = !controlsCollapsed;
    actionsEl.classList.toggle("collapsed", controlsCollapsed);
    collapseBtn.classList.toggle("collapsed", controlsCollapsed);
    document.getElementById("collapseLabel").textContent = controlsCollapsed ? I18N[currentLang].showControls : I18N[currentLang].hideControls;
  };

  const links = document.querySelectorAll(".side-nav a:not(.hidden-link)");
  const sections = Array.from(links).map(a=>document.getElementById(a.dataset.sec)).filter(Boolean);
  const spy = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        links.forEach(l=>l.classList.remove("active"));
        const match = document.querySelector(`.side-nav a[data-sec="${entry.target.id}"]`);
        if(match) match.classList.add("active");
      }
    });
  }, {rootMargin:"-20% 0px -70% 0px"});
  sections.forEach(s=>spy.observe(s));

  document.getElementById("pdfBtn").onclick = async ()=>{
    save();
    const btn = document.getElementById("pdfBtn");
    btn.disabled = true;
    const snapshot = buildPdfSnapshot(d);
    document.body.appendChild(snapshot);
    document.body.classList.add("pdf-export");
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    try{
      const canvas = await html2canvas(snapshot, { backgroundColor:"#ffffff", scale:2, useCORS:true });
      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      const { jsPDF } = window.jspdf;
      const pdfWidthPt = 800;
      const pdfHeightPt = canvas.height * (pdfWidthPt / canvas.width);
      const pdf = new jsPDF({ unit:"pt", format:[pdfWidthPt, pdfHeightPt] });
      pdf.addImage(imgData, "JPEG", 0, 0, pdfWidthPt, pdfHeightPt);
      pdf.save(`glofy-performance-review-${slugify(d.client_name)}-${slugify(d.glofer_name)}.pdf`);
    }catch(err){
      console.error(err);
      alert(I18N[currentLang].pdfError);
    }finally{
      document.body.classList.remove("pdf-export");
      snapshot.remove();
      btn.disabled = false;
    }
  };
}

/* ---------------- PDF snapshot: pure text/div markup, no form elements at all ----------------
   html2canvas struggles to reliably render <input>/<select>/<textarea> content (especially
   wrapped multi-line text). Building a throwaway, off-screen, form-free copy sidesteps that. */
function ptext(v){ return `<div style="white-space:pre-wrap;word-wrap:break-word;">${esc(v) || "&nbsp;"}</div>`; }
function buildPdfSnapshot(d){
  const t = I18N[currentLang];
  const isFirst = d.review_type === "first";
  const anyHeadsup = [d.headsup_1,d.headsup_2,d.headsup_3].some(v=>v && v.trim());
  const highlights = [d.highlight_1,d.highlight_2,d.highlight_3,d.highlight_4].filter(v=>v && v.trim());
  const headsups = [d.headsup_1,d.headsup_2,d.headsup_3].filter(v=>v && v.trim());
  const metrics = [["metric_attendance",t.m1],["metric_online",t.m2],["metric_response",t.m3],["metric_escalations",t.m4]];

  const wrap = document.createElement("div");
  wrap.id = "pdfSnapshot";
  wrap.style.cssText = "position:fixed;top:0;left:-99999px;width:860px;background:#ffffff;padding:40px;";
  wrap.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:26px;">
      <img src="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/favicon.png" crossorigin="anonymous" style="height:28px;width:auto;display:block;" onerror="this.style.display='none'">
      <div style="font-weight:900;font-size:16px;color:#161616;">Glofy</div>
      <div class="page-title" style="font-size:22px;margin:0 0 0 12px;border-left:1px solid #ddd;padding-left:14px;">${t.pageTitle}</div>
    </div>

    <div class="card cover-card">
      <div class="cover-photo"><img src="${esc(d.photo_data || DEFAULT_PHOTO)}" crossorigin="anonymous" onerror="this.style.display='none'"></div>
      <div class="cover-right">
        <div class="kicker">${SECTION_TITLES.datos}</div>
        <div class="cover-name-input" style="border:none;">${esc(d.glofer_name)}</div>
        <div class="field-grid">
          <div class="field-box"><div class="lbl">${t.rolLbl}</div><div class="val">${esc(d.glofer_role)}</div></div>
          <div class="field-box"><div class="lbl">${t.fechaLbl}</div><div class="val">${esc(dateDisplay(d.start_date, currentLang))}</div></div>
          <div class="field-box"><div class="lbl">${t.clienteFieldLbl}</div><div class="val">${esc(d.client_name)}</div></div>
          <div class="field-box"><div class="lbl">${t.reportaLbl}</div><div class="val">${esc(d.reports_to)}</div></div>
          <div class="field-box"><div class="lbl">${t.periodoLbl}</div><div class="val">${esc(periodDisplay(d, currentLang))}</div></div>
          <div class="field-box"><div class="lbl">${t.modalidadLbl}</div><div class="val">${d.schedule==="part-time"?t.partTime:t.fullTime}</div></div>
        </div>
      </div>
    </div>

    ${isFirst ? `
    <div class="card narrative">
      <div class="kicker">${SECTION_TITLES.team}</div>
      <h4>${t.equipoLbl}</h4>${ptext(d.team_text)}
      <h4>${t.proyectoLbl}</h4>${ptext(d.project_text)}
    </div>` : ``}

    <div class="card">
      <div class="kicker">${SECTION_TITLES.highlights}</div>
      <div class="pill-list">${highlights.map(h=>`<div class="pill-item">${ptext(h)}</div>`).join("")}</div>
    </div>

    <div class="card perf-body">
      <div class="kicker">${SECTION_TITLES.performance}</div>
      ${ptext(d.perf_text)}
      ${metrics.map(([key,lbl])=>`
      <div class="metric-row">
        <div class="m-lbl">${lbl}</div>
        <div class="metric-track"><i style="width:${esc(d[key]||0)}%"></i></div>
        <div class="m-val">${esc(d[key]||0)}%</div>
      </div>`).join("")}
    </div>

    ${anyHeadsup ? `
    <div class="card">
      <div class="kicker">${SECTION_TITLES.alineacion}</div>
      <div class="pill-list">${headsups.map(h=>`<div class="pill-item">${ptext(h)}</div>`).join("")}</div>
    </div>` : ``}

    <div class="card">
      <div class="kicker">${SECTION_TITLES.cross}</div>
      <a href="https://glofy.co/scopes" style="color:#3a3a3a;font-size:14px;font-weight:600;text-decoration:none;">${t.catalogoCta}</a>
    </div>

    <div class="card footer-card">
      <div>
        <div class="kicker">${SECTION_TITLES.contacto}</div>
        <div class="links">hello@glofy.co · glofy.co</div>
      </div>
    </div>
  `;
  return wrap;
}

boot();
</script>
